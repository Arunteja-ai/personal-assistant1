        value: https://frontend-beryl-zeta-m5aw8je72i.vercel.app
      - key: CLIENT_URL_PATTERNS
        value: https://*.vercel.app
      - key: MONGO_URI
        value: mongodb+srv://assistantAdmin:cKYg2JAsxTY7Nye1@cluster0.yenrhp9.mongodb.net/personal-assistant?retryWrites=true&w=majority&appName=Cluster0
